name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: constraints/lock-py311.txt
      - name: Install bubblewrap (sandbox tests)
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Allow unprivileged user namespaces (Ubuntu 24.04 restricts them with AppArmor)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Install malvalid
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/lock-py311.txt -e ".[dev,onnx,featurize,web]"
      - name: Sandbox backends (fail if bubblewrap does not work, so the sandbox tests cannot silently skip)
        run: |
          bwrap --ro-bind / / --dev /dev --unshare-net true
          malvalid sandbox-check
          malvalid sandbox-check --json | python -c "import json, sys; b = json.load(sys.stdin)['bwrap']; sys.exit(0 if b['available'] and b['network_isolated'] else 'bwrap sandbox unavailable: ' + str(b))"
      - name: Tests
        shell: bash
        run: python -m pytest tests/unit tests/e2e -q -p no:cacheprovider -rfE 2>&1 | tee pytest.log
      - name: Report test failures as annotations (job logs need sign-in; annotations are public)
        if: failure()
        shell: bash
        run: |
          [ -f pytest.log ] || exit 0
          annotate() {  # $1 = title, stdin = text; GitHub shows ~4 KB of an annotation, so keep each one short
            msg="$(sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk 'BEGIN{ORS="%0A"} {print}')"
            echo "::error title=$1::${msg}"
          }
          # 1. Every failing test id (short), 20 per annotation.
          grep -E '^(FAILED|ERROR) ' pytest.log | cut -c1-180 > failed.txt || true
          split -l 20 failed.txt failed_part_ || true
          for f in failed_part_*; do [ -s "$f" ] && annotate "failed tests ($(wc -l < failed.txt) total)" < "$f"; done
          # 2. Error lines, plus the crashing test's stack if the interpreter aborted (faulthandler output).
          { grep -E 'Interrupted|INTERNALERROR|^E   |Fatal Python error|fatal exception|^(Current thread|Thread) 0x|^  File "' pytest.log | cut -c1-240 | head -n 40; echo '--- last tests started ---'; grep -E '^tests/.*::' pytest.log | tail -n 3 | cut -c1-200; echo '--- summary ---'; tail -n 3 pytest.log; } > failures.txt || true
          annotate "pytest failures" < failures.txt
          { cat failed.txt; echo; cat failures.txt; } >> "$GITHUB_STEP_SUMMARY"

  windows:
    # Lightweight: the OS sandbox needs Linux, so this checks that the package installs and that the fast
    # tests pass without one. Tests marked `sandbox` need bubblewrap or user namespaces and are deselected;
    # any other test that needs a sandbox backend skips itself, and tests marked `posix` (process groups,
    # signals, file modes, symlinks) are skipped on Windows by tests/unit/conftest.py.
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install malvalid
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/lock-py311.txt -e ".[dev,web]"
      - name: Unit tests (no sandbox)
        env:
          PYTHONUTF8: "1"   # as the Windows launcher sets it
        shell: bash
        run: python -m pytest tests/unit -p no:cacheprovider -m "not slow and not ember and not sandbox" -rfE -v 2>&1 | tee pytest.log
      - name: Report test failures as annotations (job logs need sign-in; annotations are public)
        if: failure()
        shell: bash
        run: |
          [ -f pytest.log ] || exit 0
          annotate() {  # $1 = title, stdin = text; GitHub shows ~4 KB of an annotation, so keep each one short
            msg="$(sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk 'BEGIN{ORS="%0A"} {print}')"
            echo "::error title=$1::${msg}"
          }
          # 1. Every failing test id (short), 20 per annotation.
          grep -E '^(FAILED|ERROR) ' pytest.log | cut -c1-180 > failed.txt || true
          split -l 20 failed.txt failed_part_ || true
          for f in failed_part_*; do [ -s "$f" ] && annotate "failed tests ($(wc -l < failed.txt) total)" < "$f"; done
          # 2. Error lines, plus the crashing test's stack if the interpreter aborted (faulthandler output).
          { grep -E 'Interrupted|INTERNALERROR|^E   |Fatal Python error|fatal exception|^(Current thread|Thread) 0x|^  File "' pytest.log | cut -c1-240 | head -n 40; echo '--- last tests started ---'; grep -E '^tests/.*::' pytest.log | tail -n 3 | cut -c1-200; echo '--- summary ---'; tail -n 3 pytest.log; } > failures.txt || true
          annotate "pytest failures" < failures.txt
          { cat failed.txt; echo; cat failures.txt; } >> "$GITHUB_STEP_SUMMARY"
